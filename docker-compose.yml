services:
  sepomex-db:
    build: .
    container_name: sepomex-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sepomex}
      POSTGRES_USER: ${POSTGRES_USER:-sepomex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sepomex}
    ports:
      - "${SEPOMEX_PORT:-5433}:5432"
    volumes:
      - sepomex_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sepomex} -d ${POSTGRES_DB:-sepomex}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  sepomex_db_data:
